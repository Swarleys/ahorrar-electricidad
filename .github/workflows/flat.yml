name: flat
on:
  workflow_dispatch: {}
  schedule:
    - cron: 55 22 * * *
  push:
    paths:
      - .github/workflows/flat.yml
      - ./cleaning-electricity-price.js
concurrency:
  group: electricity-prices-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Setup deno
        uses: denoland/setup-deno@main
        with:
          deno-version: v1.x
      - name: Check out repo
        uses: actions/checkout@v3
        with:
          # Include any price update published while this run was queued.
          ref: ${{ github.ref }}
      - name: Fetch data
        uses: githubocto/flat@v3.4.0
        with:
          http_url: https://api.esios.ree.es/archives/70/download_json
          downloaded_filename: electricity-price-api.json
          authorization: ${{ secrets.API_TOKEN }}
          postprocess: ./cleaning-electricity-price.js
